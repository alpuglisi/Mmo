name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Release builds keep full debuginfo locally (profiling); CI doesn't need it.
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (fmt, build, test, clippy)
    runs-on: ubuntu-latest
    # The persistence tests run against this database too (PgStore), each
    # test in a schema of its own.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evo
          POSTGRES_PASSWORD: evo
          POSTGRES_DB: evo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evo -d evo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --release --workspace
      - name: Test
        env:
          DATABASE_URL: postgres://evo:evo@localhost:5432/evo_test
          # Fail instead of skipping the PostgreSQL tests if the URL is lost.
          EVO_REQUIRE_DATABASE: "1"
        run: cargo test --release --workspace
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Clippy (evo-server without the postgres feature)
        run: cargo clippy --release -p evo-server --no-default-features --all-targets -- -D warnings

  balance:
    name: Balance smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Build evo-sim
        run: cargo build --release -p evo-sim-cli --bin evo-sim
      # 3 seeds x 60 days on 64x64 with the default Balance; fails only if
      # fewer than 14 of the 24 lineage-worlds survive or the score drops
      # below 7 of 12 (the current rules: 21 of 24, 10.4).
      - name: Sweep (default balance)
        run: scripts/balance-smoke.sh

  client:
    name: Client (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    name: Android app (debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build the client
        run: |
          npm ci
          npm run build
      # The native project is generated, not committed (client/android/ is
      # git-ignored); the locked @capacitor/cli makes the same one each time.
      - name: Generate the Android project
        run: npx cap add android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug --console=plain
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: evolution-mmo-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      # A second, plain-http build for the emulator smoke run (its server is
      # http://10.0.2.2:8080): EVO_CAP_CLEARTEXT=1 turns on cleartext and
      # mixed content. Incremental, so it costs little; the shipped APK
      # above stays https-only.
      - name: Assemble the cleartext debug APK (for the emulator run)
        run: |
          EVO_CAP_CLEARTEXT=1 npx cap sync android
          (cd android && ./gradlew assembleDebug --console=plain)
          grep -rlq --include=AndroidManifest.xml 'usesCleartextTraffic="true"' android/app/build/intermediates \
            || { echo "the cleartext build's merged manifest has no usesCleartextTraffic=\"true\""; exit 1; }
          mkdir -p ../target/apk-cleartext
          cp android/app/build/outputs/apk/debug/app-debug.apk ../target/apk-cleartext/app-debug-cleartext.apk
      - name: Upload the cleartext APK
        uses: actions/upload-artifact@v4
        with:
          name: evolution-mmo-debug-apk-cleartext
          path: target/apk-cleartext/app-debug-cleartext.apk
          if-no-files-found: error
          retention-days: 7

  android-emulator:
    name: Android app on an emulator (smoke)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_LEVEL: 34
      EMU_TARGET: google_apis
      EMU_ARCH: x86_64
      EMU_PROFILE: pixel_6
      EMU_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
    steps:
      - uses: actions/checkout@v4
      # GitHub's documented way to let the runner user open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build evo-server
        run: cargo build --release -p evo-server --bin evo-server
      - name: Download the cleartext APK
        uses: actions/download-artifact@v4
        with:
          name: evolution-mmo-debug-apk-cleartext
          path: target/apk-cleartext
      # A booted emulator snapshot, made once per image and reused: a cold
      # boot is minutes, a snapshot boot well under one.
      - name: Cache the AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.EMU_TARGET }}-${{ env.EMU_ARCH }}-${{ env.EMU_PROFILE }}-v1
      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMU_TARGET }}
          arch: ${{ env.EMU_ARCH }}
          profile: ${{ env.EMU_PROFILE }}
          force-avd-creation: false
          emulator-options: ${{ env.EMU_OPTIONS }}
          disable-animations: false
          script: echo "AVD snapshot made for the cache"
      # The runner runs each line of `script` as its own shell; the whole run
      # is one script (client/e2e/android-emulator.sh), which retries the
      # scenario once from a clean app state. The step itself is not retried:
      # a second emulator boot would double the job's time for little.
      - name: Smoke-run the app
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: ${{ github.workspace }}/client/e2e/out/android
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMU_TARGET }}
          arch: ${{ env.EMU_ARCH }}
          profile: ${{ env.EMU_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMU_OPTIONS }}
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash client/e2e/android-emulator.sh target/apk-cleartext/app-debug-cleartext.apk
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke
          path: client/e2e/out/android/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build evo-server
        run: cargo build --release -p evo-server --bin evo-server
      - name: Build the client
        working-directory: client
        run: |
          npm ci
          npm run build
      # Playwright is not a client dependency (developer machines have it
      # and Chromium pre-installed); install both here, outside the lockfile.
      - name: Install Playwright and Chromium
        working-directory: client
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Smoke test
        working-directory: client
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/client/e2e/out
        run: npm run e2e
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: client/e2e/out/
          if-no-files-found: ignore
          retention-days: 14
