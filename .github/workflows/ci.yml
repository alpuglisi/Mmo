name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Release builds keep full debuginfo locally (profiling); CI doesn't need it.
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (fmt, build, test, clippy)
    runs-on: ubuntu-latest
    # The persistence tests run against this database too (PgStore), each
    # test in a schema of its own.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evo
          POSTGRES_PASSWORD: evo
          POSTGRES_DB: evo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evo -d evo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --release --workspace
      - name: Test
        env:
          DATABASE_URL: postgres://evo:evo@localhost:5432/evo_test
          # Fail instead of skipping the PostgreSQL tests if the URL is lost.
          EVO_REQUIRE_DATABASE: "1"
        run: cargo test --release --workspace
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Clippy (evo-server without the postgres feature)
        run: cargo clippy --release -p evo-server --no-default-features --all-targets -- -D warnings

  balance:
    name: Balance smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Build evo-sim
        run: cargo build --release -p evo-sim-cli --bin evo-sim
      # 3 seeds x 60 days on 64x64 with the default Balance; fails only if
      # fewer than 14 of the 24 lineage-worlds survive or the score drops
      # below 7 of 12 (the current rules: 21 of 24, 10.4).
      - name: Sweep (default balance)
        run: scripts/balance-smoke.sh

  client:
    name: Client (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    name: Android app (debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build the client
        run: |
          npm ci
          npm run build
      # The native project is generated, not committed (client/android/ is
      # git-ignored); the locked @capacitor/cli makes the same one each time.
      - name: Generate the Android project
        run: npx cap add android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the debug APK
        working-directory: client/android
        run: ./gradlew assembleDebug --console=plain
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: evolution-mmo-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      # A second, plain-http build for the emulator smoke run (its server is
      # http://10.0.2.2:8080): EVO_CAP_CLEARTEXT=1 turns on cleartext and
      # mixed content. Incremental, so it costs little; the shipped APK
      # above stays https-only.
      - name: Assemble the cleartext debug APK (for the emulator run)
        run: |
          EVO_CAP_CLEARTEXT=1 npx cap sync android
          (cd android && ./gradlew assembleDebug --console=plain)
          grep -rlq --include=AndroidManifest.xml 'usesCleartextTraffic="true"' android/app/build/intermediates \
            || { echo "the cleartext build's merged manifest has no usesCleartextTraffic=\"true\""; exit 1; }
          mkdir -p ../target/apk-cleartext
          cp android/app/build/outputs/apk/debug/app-debug.apk ../target/apk-cleartext/app-debug-cleartext.apk
      - name: Upload the cleartext APK
        uses: actions/upload-artifact@v4
        with:
          name: evolution-mmo-debug-apk-cleartext
          path: target/apk-cleartext/app-debug-cleartext.apk
          if-no-files-found: error
          retention-days: 7

  android-emulator:
    name: Android app on an emulator (smoke)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_LEVEL: 34
      EMU_TARGET: google_apis
      EMU_ARCH: x86_64
      EMU_PROFILE: pixel_6
      EMU_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
    steps:
      - uses: actions/checkout@v4
      # GitHub's documented way to let the runner user open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build evo-server
        run: cargo build --release -p evo-server --bin evo-server
      - name: Download the cleartext APK
        uses: actions/download-artifact@v4
        with:
          name: evolution-mmo-debug-apk-cleartext
          path: target/apk-cleartext
      # A booted emulator snapshot, made once per image and reused: a cold
      # boot is minutes, a snapshot boot well under one.
      - name: Cache the AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.EMU_TARGET }}-${{ env.EMU_ARCH }}-${{ env.EMU_PROFILE }}-v1
      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMU_TARGET }}
          arch: ${{ env.EMU_ARCH }}
          profile: ${{ env.EMU_PROFILE }}
          force-avd-creation: false
          emulator-options: ${{ env.EMU_OPTIONS }}
          disable-animations: false
          script: echo "AVD snapshot made for the cache"
      # The runner runs each line of `script` as its own shell; the whole run
      # is one script (client/e2e/android-emulator.sh), which retries the
      # scenario once from a clean app state. The step itself is not retried:
      # a second emulator boot would double the job's time for little.
      - name: Smoke-run the app
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: ${{ github.workspace }}/client/e2e/out/android
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMU_TARGET }}
          arch: ${{ env.EMU_ARCH }}
          profile: ${{ env.EMU_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMU_OPTIONS }}
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash client/e2e/android-emulator.sh target/apk-cleartext/app-debug-cleartext.apk
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke
          path: client/e2e/out/android/
          if-no-files-found: warn
          retention-days: 14

  # The iOS app on a macOS runner, in one job to pay for one macOS machine:
  # an unsigned simulator build (uploaded), then a plain-http build driven in
  # a simulator through Appium against a local evo-server. macOS minutes
  # cost more than Linux ones: everything slow is cached (cargo, Swift
  # packages, the Appium driver, WebDriverAgent's build).
  ios:
    name: iOS app (simulator build and smoke)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APPIUM_VERSION: 3.9.0
      XCUITEST_VERSION: 12.22.7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Xcode and simulators
        id: xcode
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          echo "version=$(xcodebuild -version | tr -s '\n ' '__')" >>"$GITHUB_OUTPUT"
      - name: Build the client
        working-directory: client
        run: |
          npm ci
          npm run build
      # Generated, not committed (client/ios/ is git-ignored), like Android:
      # Capacitor 8 makes a Swift Package Manager project (no CocoaPods).
      # Its capacitor:copy:after hook (scripts/ios-ats.mjs) leaves Info.plist
      # https-only without EVO_CAP_CLEARTEXT.
      - name: Generate the iOS project
        working-directory: client
        run: npx cap add ios
      # iOS outputs live in ios-out/, not target/: rust-cache restores target/
      # after these builds and overlaid a stale App.app (simctl: "Missing bundle ID").
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios-out/spm
          key: ios-spm-${{ steps.xcode.outputs.version }}-${{ hashFiles('client/package-lock.json') }}
          restore-keys: ios-spm-${{ steps.xcode.outputs.version }}-
      - name: Build the app for the simulator (unsigned)
        run: |
          bash client/scripts/ios-build-sim.sh ios-out/sim
          if plutil -extract NSAppTransportSecurity xml1 -o - ios-out/sim/App.app/Info.plist >/dev/null 2>&1; then
            echo "the shipped build has an App Transport Security exception"; exit 1
          fi
          (cd ios-out/sim && ditto -c -k --keepParent App.app evolution-mmo-simulator.zip)
      - name: Upload the simulator app
        uses: actions/upload-artifact@v4
        with:
          name: evolution-mmo-ios-simulator-app
          path: ios-out/sim/evolution-mmo-simulator.zip
          if-no-files-found: error
          retention-days: 14
      # The plain-http build for the simulator run (its server is
      # http://127.0.0.1:8080): EVO_CAP_CLEARTEXT=1 puts the ATS web-content
      # exception into Info.plist. Incremental; the app above stays https-only.
      - name: Build the cleartext app (for the simulator run)
        run: |
          (cd client && EVO_CAP_CLEARTEXT=1 npx cap sync ios)
          bash client/scripts/ios-build-sim.sh ios-out/sim-cleartext
          ats="$(plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoadsInWebContent raw -o - ios-out/sim-cleartext/App.app/Info.plist || true)"
          [ "$ats" = true ] || { echo "the cleartext build has no NSAllowsArbitraryLoadsInWebContent (got: $ats)"; exit 1; }
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Build evo-server
        run: cargo build --release -p evo-server --bin evo-server
      - name: Cache the Appium driver
        uses: actions/cache@v4
        with:
          path: ~/.appium
          key: appium-${{ runner.os }}-${{ runner.arch }}-${{ env.APPIUM_VERSION }}-xcuitest-${{ env.XCUITEST_VERSION }}
      # Appium is not a client dependency (only this job uses it).
      - name: Install Appium and the XCUITest driver
        run: |
          npm install -g "appium@$APPIUM_VERSION"
          if ! appium driver list --installed 2>&1 | grep -q xcuitest; then
            appium driver install "xcuitest@$XCUITEST_VERSION"
          fi
      # WebDriverAgent is built by the first Appium session; with its derived
      # data restored the build is incremental.
      - name: Cache WebDriverAgent's build
        uses: actions/cache@v4
        with:
          path: ~/wda-derived
          key: wda-${{ steps.xcode.outputs.version }}-${{ runner.arch }}-xcuitest-${{ env.XCUITEST_VERSION }}
      - name: Smoke-run the app in a simulator
        env:
          OUT: ${{ github.workspace }}/client/e2e/out/ios
        run: WDA_DERIVED_DATA="$HOME/wda-derived" bash client/e2e/ios-simulator.sh ios-out/sim-cleartext/App.app
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-smoke
          path: client/e2e/out/ios/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build evo-server
        run: cargo build --release -p evo-server --bin evo-server
      - name: Build the client
        working-directory: client
        run: |
          npm ci
          npm run build
      # Playwright is not a client dependency (developer machines have it
      # and Chromium pre-installed); install both here, outside the lockfile.
      - name: Install Playwright and Chromium
        working-directory: client
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Smoke test
        working-directory: client
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/client/e2e/out
        run: npm run e2e
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: client/e2e/out/
          if-no-files-found: ignore
          retention-days: 14

  # The deployment in deploy/: lint, build the image (not pushed) and run the
  # compose stack with it (evo-server, PostgreSQL, Caddy for localhost).
  docker:
    name: Docker image and deployment (build, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Shellcheck the smoke script
        run: shellcheck scripts/deploy-smoke.sh
      - name: Check the compose file
        run: |
          cp deploy/.env.example "$RUNNER_TEMP/evo.env"
          echo "POSTGRES_PASSWORD=ci" >>"$RUNNER_TEMP/evo.env"
          docker compose --env-file "$RUNNER_TEMP/evo.env" -f deploy/docker-compose.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: evo-server:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the compose stack
        env:
          EVO_IMAGE: evo-server:smoke
        run: scripts/deploy-smoke.sh
      - name: Image size
        run: docker image ls evo-server:smoke
