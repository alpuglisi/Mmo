[workspace]
resolver = "2"
members = ["crates/sim", "crates/sim-cli", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rand = "0.8"
rand_pcg = "0.3"
rayon = "1"

[profile.release]
debug = 1

# The simulation crate in one codegen unit: LLVM inlines across the whole
# tick (perception, movement, terrain), about 5% faster simulations for a
# slower release build of this one crate. Results are identical (no float
# reassociation either way).
[profile.release.package.evo-sim]
codegen-units = 1

[profile.dev]
opt-level = 1
