[package]
name = "evo-sim-cli"
description = "Command-line runner and benchmark for the evo-sim prototype."
version.workspace = true
edition.workspace = true

[[bin]]
name = "evo-sim"
path = "src/main.rs"

[dependencies]
evo-sim = { path = "../sim" }
png = "0.17"
rayon.workspace = true
rand.workspace = true
serde = { version = "1", features = ["derive"] }
# float_roundtrip: merged results must equal the unsharded run's exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
