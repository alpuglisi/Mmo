[package]
name = "evo-server"
description = "Authoritative game server for the Evolution MMO: accounts, WebSocket play, persistence."
version.workspace = true
edition.workspace = true

[[bin]]
name = "evo-server"
path = "src/main.rs"

[features]
default = ["postgres"]
# PostgreSQL persistence (`store::PgStore`, `--database-url`).
postgres = ["dep:sqlx"]

[dependencies]
evo-sim = { path = "../sim", features = ["serde"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
png = "0.17"
# Web Push (`webpush`): RFC 8291 message encryption and RFC 8292 VAPID
# signatures with RustCrypto, and an HTTPS client (rustls, ring) for the
# push services.
aes-gcm = "0.10"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
rand.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Runtime-checked queries only (no `macros`): builds need no database.
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
tower-http = { version = "0.6", default-features = false, features = ["fs", "cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The load generator measures what permessage-deflate would save.
flate2 = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
tokio-tungstenite = "0.24"
